- breaking: false
  highlights:
  - A new document type for pre-transaction terms
  - Proforma invoice is now a supported document type
  - Create a proforma invoice. Proforma invoice joins Invoice, Quote, Estimate, Receipt, and Credit Note as a first‑class document type, with
    its own independent number sequence, a valid‑until date, and a required preliminary‑status notice on export.
  - Convert to invoice. When a proforma is confirmed, create a fresh invoice from it with its own number — the source proforma is left unchanged,
    and the new invoice opens for review before anything is sent.
  date: '2026-09-22'
- breaking: false
  highlights:
  - Norway and Sweden payment references
  - Generate KID and OCR reference numbers, not just check them
  - Generate a KID number. The Norway KID tool can now create a valid reference from your own digits, including padding to a bank‑agreed length,
    in addition to checking an existing one.
  - Generate an OCR reference. The Sweden OCR tool can now create a valid reference (variable or fixed length), in addition to checking an existing
    one.
  date: '2026-09-21'
- breaking: false
  highlights:
  - Official Postman collection for the Document API
  - Postman collection. Import a ready‑made collection and production environment for the Developer Document API and start calling it without
    hand‑writing requests.
  date: '2026-09-20'
- breaking: false
