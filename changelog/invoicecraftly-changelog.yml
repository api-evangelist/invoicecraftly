- breaking: false
  highlights:
  - Days past due calculator. Enter a due date and today (or any date) to see how many calendar days an invoice is overdue, without needing an
    amount or rate.
  - Overdue workflow. Carry the dates from Days past due into the late payment interest calculator, then into the payment reminder generator.
  - Embed the due date calculator on your website. The invoice due date calculator page now has an Embed this calculator section with copy-and-paste
    code for a compact version of the tool.
  date: '2026-09-29'
- breaking: false
  highlights:
  - Calculate due date, inside the editor. A button under the invoice and due dates lets you choose a payment term, preview the date, and apply
    it to the invoice you are editing.
  - Add hourly work, inside the editor. Enter hours and a rate to add reviewed line items to your invoice without switching to another page.
  - Retainer invoice calculator. Multiply included monthly hours by an hourly rate to see the monthly retainer and how it would appear as one
    invoice line.
  date: '2026-09-28'
- breaking: false
  highlights:
  - Invoice calculator. Add line items, a discount and tax to see the invoice total, then open the exact invoice in the editor.
  - Hourly invoice calculator. Enter hours in decimal, 2:15, 2h 15m or minutes form, add a rate, and turn the result into invoice lines.
  date: '2026-09-27'
- breaking: false
  highlights:
  - Remind about payment. From the More menu, start a prefilled email or WhatsApp reminder for any invoice that is unpaid, partially paid, or
    overdue.
  date: '2026-09-17'
- breaking: false
  highlights:
  - Status on the PDF. Exported and printed invoices now stamp Unpaid, Partially paid, Paid, or Overdue, plus a Balance due line whenever money
    is still owed.
  date: '2026-09-17'
- breaking: false
  highlights:
